services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./social-media-api
    environment:
      DB_URI: mongodb://mongo:27017/api-db
      SECRET: some-dev-secret
    depends_on:
      - mongo
    deploy:
      replicas: 2
    expose:
      - "3000"

  frontend:
    build:
      context: ./planet-link
      args:
        VITE_BASE_URL: https://localhost/api
    depends_on:
      - backend

  lb:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  netdata:
    image: netdata/netdata
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  mongo-data: